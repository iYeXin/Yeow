name: Release

# Tag a version (e.g. `git tag v0.6.1 && git push origin v0.6.1`) to build the
# JAR with Zig and publish it as a GitHub Release. Release notes are taken from
# the matching CHANGELOG.md section.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: zig build jar

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp zig-out/yeow-quickjs.jar release-artifacts/

      - name: Resolve release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk "/^## ${VERSION}/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md)"
          if [ -z "$NOTES" ]; then NOTES="Release ${GITHUB_REF_NAME}"; fi
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          body: ${{ env.RELEASE_NOTES }}
          generate_release_notes: true
          fail_on_unmatched_files: false
